name: Backup to Google Drive

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          zip -r co-bee-backup.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.yml"
          echo "ZIP created: $(du -sh co-bee-backup.zip)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}

      - name: Upload ZIP to Google Drive
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: co-bee-backup.zip
          destination: ${{ secrets.GDRIVE_FOLDER_ID }}
          process_gcloudignore: false

      - name: Confirm upload
        run: echo "✅ Backup uploaded to Google Drive folder ${{ secrets.GDRIVE_FOLDER_ID }}"
