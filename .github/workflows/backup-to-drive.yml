name: Backup to Google Drive

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:       # Also allows manual trigger from Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create ZIP archive with date stamp
        run: |
          DATE=$(date +'%Y-%m-%d')
          zip -r co-bee-backup-$DATE.zip . \
            --exclude ".git/*" \
            --exclude ".github/*"
          echo "ZIP_NAME=co-bee-backup-$DATE.zip" >> $GITHUB_ENV
          echo "ZIP created: $(du -sh co-bee-backup-$DATE.zip)"

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          filename: ${{ env.ZIP_NAME }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: ${{ env.ZIP_NAME }}
          overwrite: false
