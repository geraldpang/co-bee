<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — co·bee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --honey: #F5A623;
    --honey-deep: #E8891A;
    --teal: #1AA39A;
    --teal-dark: #0D7A72;
    --teal-light: #E8F7F6;
    --cream: #FFFBF4;
    --dark: #1A1A2E;
    --mid: #4A4A6A;
    --white: #FFFFFF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; width: 100%; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    background: rgba(255,251,244,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(26,163,154,0.12);
  }
  .logo { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 900; color: var(--teal); letter-spacing: -1px; text-decoration: none; display: inline-block; }
  .logo span { color: var(--honey); }
  .tagline-nav { font-size: 11px; color: var(--mid); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .nav-link { font-size: 14px; color: var(--mid); text-decoration: none; font-weight: 500; transition: color 0.2s; }
  .nav-link:hover { color: var(--teal); }

  .page-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 120px 24px 60px;
  }
  .signup-card {
    width: 100%; max-width: 440px; background: white; border-radius: 24px;
    padding: 36px 34px; box-shadow: 0 10px 40px rgba(26,26,46,0.08);
    border: 1px solid rgba(26,163,154,0.12);
  }
  .signup-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 900; color: var(--dark); letter-spacing: -0.5px; margin-bottom: 8px; }
  .signup-sub { font-size: 13.5px; color: var(--mid); line-height: 1.6; margin-bottom: 24px; }
  .signup-sub strong { color: var(--teal-dark); }

  .host-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--teal-light); border: 1px solid rgba(26,163,154,0.2);
    border-radius: 14px; padding: 10px 14px; margin-bottom: 22px;
  }
  .host-chip-emoji { font-size: 20px; }
  .host-chip-name { font-size: 13px; font-weight: 700; color: var(--teal-dark); }
  .host-chip-by { font-size: 11.5px; color: var(--mid); }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--mid); margin-bottom: 6px; }
  .form-input {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(26,163,154,0.2); font-size: 14px; font-family: inherit;
    color: var(--dark); outline: none; transition: border-color 0.15s;
  }
  .form-input:focus { border-color: var(--teal); }

  .btn-primary {
    width: 100%; background: var(--teal); color: white; border: none;
    padding: 13px 20px; border-radius: 100px; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; margin-top: 6px;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }

  .form-foot { text-align: center; font-size: 12.5px; color: var(--mid); margin-top: 18px; }
  .form-foot a { color: var(--teal); text-decoration: none; font-weight: 600; }

  /* Success state */
  .success-state { display: none; text-align: center; }
  .success-state.show { display: block; }
  .signup-form.hide { display: none; }
  .success-icon {
    width: 60px; height: 60px; border-radius: 50%; background: var(--teal-light);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
    font-size: 28px;
  }
  .success-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 900; color: var(--dark); margin-bottom: 10px; }
  .success-sub { font-size: 13.5px; color: var(--mid); line-height: 1.6; margin-bottom: 22px; }
  .success-sub strong { color: var(--teal-dark); }
  .btn-secondary {
    display: inline-block; background: transparent; color: var(--teal-dark);
    border: 1.5px solid rgba(26,163,154,0.35); padding: 11px 22px; border-radius: 100px;
    font-size: 13.5px; font-weight: 600; text-decoration: none; margin-top: 4px;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: var(--teal-light); }
</style>
</head>
<body>

<nav>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
    <a href="cobee-redesign__6_.html" class="logo" style="text-decoration:none;">co<span>·</span>bee</a>
    <a href="cobee-redesign__6_.html" class="nav-link">← Back to co·bee</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="signup-card">

    <!-- SIGNUP FORM -->
    <div class="signup-form" id="signupForm">
      <div class="signup-title">Create your account</div>
      <div class="signup-sub" id="signupSub">Join co·bee to start buying together and saving more.</div>

      <div class="host-chip" id="hostChip" style="display:none;">
        <div class="host-chip-emoji" id="hostChipEmoji">🎁</div>
        <div>
          <div class="host-chip-name" id="hostChipName"></div>
          <div class="host-chip-by" id="hostChipBy"></div>
        </div>
      </div>

      <form id="signupFormEl">
        <div class="form-group">
          <label class="form-label">Full name</label>
          <input class="form-input" type="text" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mobile number</label>
          <input class="form-input" type="tel" placeholder="9123 4567" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <div class="form-foot">Already have an account? <a href="signin.html">Sign in</a></div>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success-state" id="successState">
      <div class="success-icon">🐝</div>
      <div class="success-title" id="successTitle">Account created!</div>
      <div class="success-sub" id="successSub">Welcome to co·bee.</div>
      <a href="cobee-redesign__6_.html" class="btn-secondary" id="successAction">Continue</a>
    </div>

  </div>
</div>

<script>
  var params = new URLSearchParams(window.location.search);
  var hostName = params.get('host');
  var hostedBy = params.get('hostname');

  if (hostName) {
    // Arrived here by picking a specific host on the map — signup carries
    // that choice, so we skip the "find hosts" step after account creation.
    document.getElementById('hostChip').style.display = 'flex';
    document.getElementById('hostChipName').textContent = hostName;
    document.getElementById('hostChipBy').textContent = hostedBy ? ('Hosted by ' + hostedBy) : '';
    document.getElementById('signupSub').innerHTML = 'Finish creating your account to join <strong>' + hostName + '</strong>.';
  }

  document.getElementById('signupFormEl').addEventListener('submit', function (e) {
    e.preventDefault();

    document.getElementById('signupForm').classList.add('hide');
    var successEl = document.getElementById('successState');
    var titleEl = document.getElementById('successTitle');
    var subEl = document.getElementById('successSub');
    var actionEl = document.getElementById('successAction');

    if (hostName) {
      // Already picked a host — no need to send them find-hosts again.
      titleEl.textContent = "You're all set!";
      subEl.innerHTML = "Your account is ready, and you've joined <strong>" + hostName + '</strong>' +
        (hostedBy ? (' hosted by <strong>' + hostedBy + '</strong>') : '') + '.';
      actionEl.textContent = 'Back to co·bee';
      actionEl.href = 'cobee-redesign__6_.html';
    } else {
      // Generic signup — next step is helping them find a host to join.
      titleEl.textContent = 'Account created!';
      subEl.textContent = "Now let's find a host near you to join.";
      actionEl.textContent = 'Find hosts near you →';
      actionEl.href = 'find-hosts.html';
    }

    successEl.classList.add('show');

    if (!hostName) {
      setTimeout(function () {
        window.location.href = 'find-hosts.html';
      }, 1400);
    }
  });
</script>

</body>
</html>
