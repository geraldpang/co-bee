<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>co·bee</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F6F8; display: flex; flex-direction: column; }

/* ── TOPBAR ── */
.topbar { background: #009A97; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; flex-shrink: 0; z-index: 600; position: relative; }
.topbar-brand p:first-child { font-size: 17px; font-weight: 600; color: white; line-height: 1.1; }
.topbar-brand p:last-child  { font-size: 9px; color: rgba(255,255,255,0.65); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.notif-wrap { position: relative; cursor: pointer; }
.notif-dot { position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: #F5A623; border-radius: 50%; border: 1.5px solid #009A97; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #E8971A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: white; cursor: pointer; }

/* ── CONTENT AREA ── */
.content-wrap { flex: 1; display: flex; overflow: hidden; min-height: 0; }

/* ── IFRAME ── */
.main-frame { flex: 1; border: none; width: 100%; height: 100%; background: #F4F6F8; }

/* ── BOTTOM BAR ── */
.bottom-bar { background: white; border-top: 0.5px solid #e0e0e0; display: flex; align-items: center; flex-shrink: 0; z-index: 100; }
.bottom-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0; cursor: pointer; color: #888; font-size: 10px; border: none; background: none; font-family: inherit; transition: color 0.15s; }
.bottom-btn.active { color: #009A97; }
.bottom-btn:hover { color: #009A97; }

/* ── DRAWER ── */
.drawer-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: transparent; z-index: 500; }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 52px; left: 0; bottom: 0; width: 260px; background: white; z-index: 501; display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.28s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.1); }
.drawer.open { transform: translateX(0); }
.drawer-group { display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #E0F5F5; border-bottom: 0.5px solid #b2e4e3; cursor: pointer; height: 44px; flex-shrink: 0; }
.drawer-group-av { width: 30px; height: 30px; border-radius: 50%; background: #E8971A; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }
.drawer-group-name { font-size: 13px; font-weight: 600; color: #005f5d; }
.drawer-group-sub  { font-size: 11px; color: #009A97; }
.drawer-nav { flex: 1; overflow-y: auto; padding: 8px; }
.drawer-section { font-size: 10px; font-weight: 600; color: #888780; letter-spacing: 0.07em; text-transform: uppercase; padding: 10px 8px 4px; }
.drawer-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: #1a1a18; cursor: pointer; text-decoration: none; transition: background 0.12s; }
.drawer-item:hover { background: #f0fafa; color: #007A77; }
.drawer-item.active { background: #E0F5F5; color: #007A77; font-weight: 600; }
.drawer-item svg { flex-shrink: 0; color: inherit; }
.drawer-badge { margin-left: auto; font-size: 10px; font-weight: 600; background: #f0f0f0; color: #888; border-radius: 99px; padding: 1px 7px; border: 0.5px solid #e0e0e0; }
.drawer-item.active .drawer-badge { background: #009A97; color: white; border-color: #009A97; }
.drawer-footer { padding: 12px 16px; border-top: 0.5px solid #e0dfd8; display: flex; align-items: center; gap: 10px; }
.drawer-footer-av { width: 34px; height: 34px; border-radius: 50%; background: #E8971A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; flex-shrink: 0; }
.drawer-footer-name { font-size: 13px; font-weight: 600; color: #1a1a18; }
.drawer-footer-role { font-size: 11px; color: #009A97; }
.drawer-switch-btn { margin-left: auto; font-size: 11px; font-weight: 600; color: #009A97; background: #E0F5F5; border: 0.5px solid #80CCCB; border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

  /* ── NAV TABS (member view only) ── */
  .nav-tabs { background: white; border-bottom: 0.5px solid #e0e0e0; display: flex; justify-content: center; flex-shrink: 0; z-index: 90; }
  .nav-tab { padding: 11px 18px; font-size: 13px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s; white-space: nowrap; }
  .nav-tab.active { color: #009A97; border-bottom-color: #009A97; font-weight: 500; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="width:80px;display:flex;align-items:center;flex-shrink:0;">
    <div onclick="toggleDrawer()" style="cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.15);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
  </div>
  <div id="topbar-brand" style="flex:1;text-align:center;pointer-events:none;transition:margin-left 0.28s ease;">
    <p style="font-size:17px;font-weight:600;color:white;line-height:1.1;">co<span style="color:#F5A623;">·</span>bee</p>
    <p style="font-size:9px;color:rgba(255,255,255,0.65);">Good things must share!</p>
  </div>
  <div class="topbar-right" style="width:80px;justify-content:flex-end;">
    <div class="notif-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="notif-dot"></div>
    </div>
    <div class="avatar">MC</div>
  </div>
</div>


<div id="main-wrap" style="flex:1;display:flex;flex-direction:column;overflow:hidden;transition:margin-left 0.28s ease;min-height:0;">
<!-- NAV TABS — member view only -->
<div id="nav-tabs-wrap" style="display:flex;flex-direction:column;">
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="iframeTab('all')">Events (3)</div>
    <div class="nav-tab" onclick="iframeTab('purchase')">My Purchase</div>
    <div class="nav-tab" onclick="iframeTab('group')">My Group</div>
  </div>
</div>

<!-- CONTENT AREA with iframe -->
<div class="content-wrap" id="content-wrap">
  <iframe class="main-frame" id="main-frame" src="member.html"></iframe>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="bottom-btn" id="btn-hosting" onclick="navigate('hosting.html', this)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
    Hosting
  </button>
  <button class="bottom-btn active" id="btn-member" onclick="navigate('member.html', this)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Member
  </button>
  <button class="bottom-btn" id="btn-hosted" onclick="navigate('hosted-events.html', this)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Hosted Event
  </button>
</div>

</div><!-- end main-wrap -->
<!-- SIDEBAR DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="switch-drawer">
  <div class="drawer-group">
    <div class="drawer-group-av">M6</div>
    <div>
      <div class="drawer-group-name">M6 Group</div>
      <div class="drawer-group-sub">2 members</div>
    </div>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#009A97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>
  </div>
  <nav class="drawer-nav">
    <div class="drawer-section">Main</div>
    <a class="drawer-item" onclick="navigate('hosted-events.html', document.getElementById('btn-hosted'))">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Hosted Events
      <span class="drawer-badge">5</span>
    </a>
    <a class="drawer-item" onclick="navigate('hosted-events.html', document.getElementById('btn-hosted'))">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Order Management
    </a>
    <a class="drawer-item" onclick="navigate('hosted-events.html', document.getElementById('btn-hosted'))">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Products / Items
    </a>
    <a class="drawer-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-4"/></svg>
      Delivery
    </a>
    <a class="drawer-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Packing List
    </a>
    <div class="drawer-section" style="margin-top:10px;">Administration</div>
    <a class="drawer-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Members
    </a>
    <a class="drawer-item">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      Settings
    </a>
  </nav>
  <div class="drawer-footer">
    <div class="drawer-footer-av">MC</div>
    <div>
      <div class="drawer-footer-name">Minh Cong</div>
      <div class="drawer-footer-role">Admin</div>
    </div>
    <div class="drawer-switch-btn" onclick="navigate('member.html', document.getElementById('btn-member'))">← Member view</div>
  </div>
</div>

<script>
let drawerOpen = false;

function navigate(src, btn) {
  document.getElementById('main-frame').src = src;
  document.querySelectorAll('.bottom-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.drawer-item').forEach(a => a.classList.remove('active'));
  // Show nav tabs only for member view
  document.getElementById('nav-tabs-wrap').style.display = src === 'member.html' ? 'flex' : 'none';
  closeDrawer();
}

function iframeTab(tab) {
  // Update active nav tab
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', ['all','purchase','group'][i] === tab);
  });
  // Tell iframe to switch tab
  const frame = document.getElementById('main-frame');
  frame.contentWindow.postMessage({type:'switchTab', tab: tab}, '*');
}

function toggleDrawer() {
  drawerOpen ? closeDrawer() : openDrawer();
}

function openDrawer() {
  drawerOpen = true;
  document.getElementById('switch-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('main-wrap').style.marginLeft = '260px';
  document.getElementById('topbar-brand').style.marginLeft = '260px';
}

function closeDrawer() {
  drawerOpen = false;
  document.getElementById('switch-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('main-wrap').style.marginLeft = '0';
  document.getElementById('topbar-brand').style.marginLeft = '0';
}
</script>
</body>
</html>
