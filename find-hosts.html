<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Hosts Near You — co·bee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --honey: #F5A623;
    --honey-deep: #E8891A;
    --teal: #1AA39A;
    --teal-dark: #0D7A72;
    --teal-light: #E8F7F6;
    --cream: #FFFBF4;
    --dark: #1A1A2E;
    --mid: #4A4A6A;
    --white: #FFFFFF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; width: 100%; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    background: rgba(255,251,244,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(26,163,154,0.12);
  }
  .logo { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 900; color: var(--teal); letter-spacing: -1px; text-decoration: none; display: inline-block; }
  .logo span { color: var(--honey); }
  .nav-link { font-size: 14px; color: var(--mid); text-decoration: none; font-weight: 500; transition: color 0.2s; }
  .nav-link:hover { color: var(--teal); }

  .find-page-wrap { padding: 110px 24px 80px; }
  .find-page-inner { max-width: 900px; margin: 0 auto; }
  .find-page-header { text-align: center; margin-bottom: 32px; }
  .find-page-title {
    font-family: 'Fraunces', serif; font-size: clamp(30px, 4vw, 42px); font-weight: 900;
    letter-spacing: -1px; color: var(--dark); margin-bottom: 10px;
  }
  .find-page-title em { color: var(--teal); font-style: italic; }
  .find-page-sub { font-size: 15px; color: var(--mid); max-width: 480px; margin: 0 auto; line-height: 1.6; }

  /* ─── Toast ─── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--dark); color: white; padding: 13px 22px; border-radius: 100px;
    font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--teal-dark); }

  /* ─── Join-question modal ─── */
  .join-question-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(26,26,46,0.45);
    align-items: center; justify-content: center; padding: 24px;
  }
  .join-question-overlay.show { display: flex; }
  .join-question-modal {
    background: white; border-radius: 20px; padding: 28px 26px;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .join-question-title {
    font-family: 'Fraunces', serif; font-size: 19px; font-weight: 900;
    color: var(--dark); margin-bottom: 8px;
  }
  .join-question-sub { font-size: 13.5px; color: var(--mid); line-height: 1.5; margin-bottom: 16px; }
  .join-question-textarea {
    width: 100%; min-height: 90px; border: 1.5px solid rgba(26,163,154,0.2);
    border-radius: 12px; padding: 12px 14px; font-size: 14px;
    font-family: 'DM Sans', sans-serif; color: var(--dark);
    outline: none; resize: vertical; transition: border-color 0.15s;
    margin-bottom: 18px;
  }
  .join-question-textarea:focus { border-color: var(--teal); }
  .join-question-actions { display: flex; gap: 10px; }
  .join-question-btn-cancel {
    flex: 1; background: white; color: var(--mid);
    border: 1.5px solid rgba(26,163,154,0.2); border-radius: 100px;
    padding: 11px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  .join-question-btn-cancel:hover { background: var(--teal-light); }
  .join-question-btn-submit {
    flex: 1.4; background: var(--teal); color: white; border: none;
    border-radius: 100px; padding: 11px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .join-question-btn-submit:hover { background: var(--teal-dark); }

  /* ─── HERO MAP CARD (sits beside hero text, map + list side by side) ─── */
  .hero-map-card {
    background: transparent; border-radius: 0; padding: 0;
    box-shadow: none; border: none;
    width: 100%; min-width: 0; box-sizing: border-box;
  }
  .hero-map-card .map-head {
    max-width: none; margin: 0 0 10px; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; row-gap: 10px;
  }
  .hero-map-card .map-head .section-label {
    font-size: 20px; font-weight: 700; letter-spacing: -0.3px; text-transform: none;
    margin-bottom: 0; flex-shrink: 0;
  }
  .map-search-field { position: relative; width: 100%; max-width: 300px; }
  .map-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--mid); pointer-events: none; }
  .hero-map-card .map-search { width: 100%; padding: 10px 14px 10px 38px; font-size: 13px; }

  /* Map full-width on top, host list as a horizontal strip below it */
  .map-split { display: block; min-width: 0; }

  .hero-map-card .map-stage {
    max-width: none; min-width: 0; padding: 4px 0 0; border-radius: 0;
    background: transparent; border: none; box-shadow: none;
  }

  .hero-map-card .host-list-wrap { max-width: none; min-width: 0; margin: 18px 0 0; }
  .hero-map-card .host-list-title { text-align: left; margin-bottom: 10px; }
  .hero-map-card .host-list {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; min-width: 0;
  }
  .hero-map-card .host-card { flex: none; min-width: 0; scroll-snap-align: none; }

  /* ─── HOST MAP (legacy full-width section, kept for reference) ─── */
  .map-section { background: var(--cream); padding: 90px 24px; border-bottom: 1px solid rgba(26,163,154,0.1); }
  .map-inner { max-width: 1100px; margin: 0 auto; }
  .map-head { text-align: center; max-width: 620px; margin: 0 auto 40px; }
  .map-head .section-title { text-align: center; margin-bottom: 12px; color: var(--dark); }
  .map-head p { font-size: 16px; color: var(--mid); line-height: 1.7; }

  .map-search-wrap { max-width: 460px; margin: 0 auto 36px; position: relative; }
  .map-search {
    width: 100%; padding: 15px 20px; border-radius: 100px;
    border: 1.5px solid rgba(26,163,154,0.25); background: white;
    font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--dark);
    outline: none; box-shadow: 0 4px 20px rgba(26,26,46,0.05);
  }
  .map-search:focus { border-color: var(--teal); }
  .map-search-hint { text-align: center; font-size: 12.5px; color: var(--mid); margin-top: 10px; }
  .map-result-msg {
    text-align: center; font-size: 14px; font-weight: 600; color: var(--teal-dark);
    margin-top: 14px; min-height: 20px;
  }

  .map-stage {
    background: white; border: 1px solid rgba(26,163,154,0.15);
    border-radius: 24px; padding: 20px; box-shadow: 0 4px 30px rgba(26,26,46,0.05);
    max-width: 640px; margin: 0 auto;
  }
  .map-stage svg { width: 100%; height: auto; display: block; }
  .sg-outline { fill: var(--teal-light); stroke: rgba(26,163,154,0.45); stroke-width: 1.5; filter: drop-shadow(0 8px 18px rgba(26,163,154,0.12)); }
  .host-pin { fill: rgba(26,163,154,0.22); opacity: 1; transition: fill 0.2s, opacity 0.2s, r 0.2s; cursor: default; pointer-events: none; }
  .host-pin.near { fill: var(--teal-dark); opacity: 1; }
  .search-pin { fill: #E24B4A; stroke: white; stroke-width: 1.5; }
  .search-pin-ring { fill: none; stroke: #E24B4A; stroke-width: 1.5; opacity: 0.5; }

  .near-pin { opacity: 0; transform: translateY(-4px) scale(1); transition: opacity 0.25s ease, transform 0.18s ease; transform-origin: 0px 0px; }
  .near-pin.show { opacity: 1; transform: translateY(0) scale(1); }
  .near-pin.show.pin-active { transform: translateY(0) scale(1.4); }
  .near-pin-path { fill: var(--teal-dark); stroke: white; stroke-width: 2; filter: drop-shadow(0 3px 5px rgba(26,26,46,0.3)); transition: fill 0.15s ease; }
  .near-pin.pin-active .near-pin-path { fill: var(--honey-deep); }
  .near-pin-dot { fill: white; }
  .near-pin-emoji { font-size: 13px; pointer-events: none; }

  .map-legend { display: flex; justify-content: center; gap: 24px; margin-top: 18px; font-size: 12.5px; color: var(--mid); }
  .map-legend-item { display: flex; align-items: center; gap: 6px; }
  .map-legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .map-count-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--teal-light); color: var(--teal-dark);
    padding: 5px 14px; border-radius: 100px; font-size: 12.5px; font-weight: 600;
    margin-top: 16px;
  }
  .map-count-wrap { text-align: center; }

  .host-list-wrap { max-width: 640px; margin: 28px auto 0; display: none; }
  .host-list-wrap.show { display: block; }
  .host-list-title { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 12px; text-align: center; }
  .host-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .host-card {
    background: white; border: 1px solid rgba(26,163,154,0.15); border-radius: 14px;
    padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 2px 10px rgba(26,26,46,0.04);
    opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .host-card.show { opacity: 1; transform: translateY(0); }
  .host-card-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--teal-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .host-card-info { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .host-card-name { font-size: 12.5px; font-weight: 700; color: var(--dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host-card-dist { font-size: 10.5px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .host-card-join {
    background: var(--teal); color: white; border: none;
    padding: 7px 14px; border-radius: 100px; font-size: 11.5px; font-weight: 600;
    text-decoration: none; white-space: nowrap; flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s;
    opacity: 0; pointer-events: none;
    font-family: inherit; cursor: pointer;
  }
  .host-card-join:hover { background: var(--teal-dark); }
  .host-card-join.is-pending, .host-card-join.is-pending:hover {
    background: rgba(245,166,35,0.15); color: var(--honey-deep); cursor: not-allowed;
  }
  .host-card:hover .host-card-join { opacity: 1; pointer-events: auto; }
  .host-card { cursor: default; transition: opacity 0.25s ease, transform 0.25s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
  .host-card:hover { box-shadow: 0 4px 16px rgba(26,163,154,0.18); }
  .host-card-highlight { border-color: var(--honey-deep); box-shadow: 0 0 0 2px rgba(232,137,26,0.25), 0 4px 16px rgba(232,137,26,0.18); }

  /* ─── MAP HOVER TOOLTIP ─── */
  .map-stage { position: relative; }
  .host-pin { cursor: default; }
  .near-pin { cursor: pointer; }
  .hover-ping { fill: none; stroke: var(--teal-dark); stroke-width: 1.5; opacity: 0; transition: opacity 0.15s ease; }
  .hover-ping.show { opacity: 0.9; }
  .host-tooltip {
    position: absolute; z-index: 30; left: 0; top: 0;
    background: white; border-radius: 12px; padding: 8px 10px;
    box-shadow: 0 10px 30px rgba(26,26,46,0.18); border: 1px solid rgba(26,163,154,0.15);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    opacity: 0; transform: translate(-50%, -92%) scale(0.94);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
  }
  .host-tooltip.show { opacity: 1; transform: translate(-50%, -100%) scale(1); pointer-events: auto; }
  .host-tooltip .tt-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--teal-light);
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .host-tooltip .tt-info { display: flex; flex-direction: column; gap: 0; }
  .host-tooltip .tt-name { font-size: 12px; font-weight: 700; color: var(--dark); }
  .host-tooltip .tt-host { font-size: 10.5px; color: var(--mid); }
  .host-tooltip .tt-join {
    background: var(--teal); color: white; border: none;
    padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 600;
    text-decoration: none; white-space: nowrap; transition: background 0.15s;
    font-family: inherit; cursor: pointer;
  }
  .host-tooltip .tt-join:hover { background: var(--teal-dark); }
  .host-tooltip .tt-join.is-pending, .host-tooltip .tt-join.is-pending:hover {
    background: rgba(245,166,35,0.15); color: var(--honey-deep); cursor: not-allowed;
  }


</style>

<body>

<nav>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;width:100%;">
    <a href="cobee-redesign__6_.html" class="logo" style="text-decoration:none;">co<span>·</span>bee</a>
    <a href="cobee-redesign__6_.html" class="nav-link">← Back to co·bee</a>
  </div>
</nav>

<div class="find-page-wrap">
  <div class="find-page-inner">

    <div class="find-page-header">
      <div class="find-page-title">Find hosts <em>near you</em></div>
      <div class="find-page-sub">Search a postal code or neighbourhood to see group buys happening close to you, then tap a pin to join.</div>
    </div>

    <div class="hero-map-card" id="hosts">

      <div class="map-head">
        <div class="section-label" style="color:var(--teal);">Find hosts near you</div>
        <div class="map-search-field">
          <svg class="map-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="map-search" id="hostSearch" list="sgAreas" inputmode="text" placeholder="Postal code or neighbourhood">
        </div>
        <datalist id="sgAreas"></datalist>
      </div>

      <div class="map-stage">
        <svg id="sgMapSvg" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
          <g id="outlineLayer"></g>
          <g id="hostPinsLayer"></g>
          <g id="nearPinsLayer"></g>
          <g id="searchPinLayer"></g>
          <g id="hoverPinLayer"></g>
        </svg>

        <div class="host-tooltip" id="hostTooltip"></div>
      </div>

      <div class="map-split">
        <div class="host-list-wrap" id="hostListWrap">
          <div class="host-list-title" id="hostListTitle">Closest hosts near you</div>
          <div class="host-list" id="hostList"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- Join-question modal — shown when a host's approvalMode is 'question' -->
<div class="join-question-overlay" id="joinQuestionOverlay">
  <div class="join-question-modal">
    <div class="join-question-title">One quick question</div>
    <div class="join-question-sub" id="joinQuestionModalText"></div>
    <textarea class="join-question-textarea" id="joinQuestionAnswer" placeholder="Type your answer..."></textarea>
    <div class="join-question-actions">
      <button type="button" class="join-question-btn-cancel" onclick="closeJoinQuestionModal()">Cancel</button>
      <button type="button" class="join-question-btn-submit" onclick="submitJoinQuestion()">Submit request</button>
    </div>
  </div>
</div>

<script>
  // Minimal toast helper, following the project's showToast(message, type) pattern.
  var toastTimer = null;
  function showToast(message, type) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.className = 'toast' + (type ? (' ' + type) : '') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }
</script>

      var s = pinScaleFactor().toFixed(4);
      var kids = nearPinsLayer.children;
      for (var i = 0; i < kids.length; i++) {
        var el = kids[i];
        var x = el.getAttribute('data-px'), y = el.getAttribute('data-py');
        if (x !== null) el.setAttribute('transform', 'translate(' + x + ',' + y + ') scale(' + s + ')');
      }
    }

    var HOST_FIRST_NAMES = ['Mei', 'Wei', 'Siti', 'Farah', 'Li Ting', 'Jun Wei', 'Amirah', 'Kai Xin',
      'Hui Min', 'Zul', 'Priya', 'Aisyah', 'Wen Jie', 'Nur', 'Shu Hui', 'Faizal',
      'Xin Yi', 'Rashid', 'Geok Lian', 'Benjamin'];
    var HOST_LAST_NAMES = ['Tan', 'Lim', 'Lee', 'Wong', 'Ng', 'Abdullah', 'Kumar', 'Rahman',
      'Chua', 'Goh', 'Yeo', 'Koh', 'Teo', 'Osman', 'Ong'];
    function hostName(i) {
      return HOST_FIRST_NAMES[i % HOST_FIRST_NAMES.length] + ' ' +
        HOST_LAST_NAMES[(i * 7) % HOST_LAST_NAMES.length];
    }

    var GROUPBUY_CATEGORIES = [
      ['🥦', 'Fresh Produce'], ['🍜', 'Korean Snacks'], ['🧴', 'Skincare'], ['🐟', 'Seafood'],
      ['🧺', 'Household Essentials'], ['🍚', 'Bulk Rice & Grains'], ['🍰', 'Bakery Treats'],
      ['🧻', 'Toiletries'], ['🍗', 'Frozen Meats'], ['🥤', 'Bubble Tea Supplies'],
      ['🍲', 'Hotpot Ingredients'], ['🧀', 'Cheese & Dairy'], ['🌶️', 'Spices & Condiments'],
      ['🍉', 'Fresh Fruits'], ['🧹', 'Cleaning Supplies'], ['👕', 'Kids Clothing'],
      ['🧸', 'Toys & Books'], ['🌿', 'Traditional Tea & Herbs'], ['🍱', 'Instant Noodles'],
      ['🧃', 'Snacks & Drinks']
    ];
    var GROUPBUY_FORMATS = ['Bundle', 'Group Buy', 'Weekly Run', 'Restock', 'Haul', 'Box'];
    function groupBuyFor(i) {
      var cat = GROUPBUY_CATEGORIES[i % GROUPBUY_CATEGORIES.length];
      var fmt = GROUPBUY_FORMATS[(i * 3) % GROUPBUY_FORMATS.length];
      return { emoji: cat[0], name: cat[1] + ' ' + fmt };
    }

    // Some hosts require the host to approve a join request before it goes
    // through; some also ask a short question first. Deterministic by index
    // so it's consistent across reloads, not random.
    var APPROVAL_MODES = ['open', 'open', 'open', 'approval', 'open', 'question'];
    var JOIN_QUESTIONS = [
      'What made you interested in this group buy?',
      'Have you joined one of our group buys before?',
      'Any delivery or collection notes we should know about you?'
    ];
    function approvalModeFor(i) { return APPROVAL_MODES[i % APPROVAL_MODES.length]; }
    function joinQuestionFor(i) { return JOIN_QUESTIONS[i % JOIN_QUESTIONS.length]; }

    hosts.forEach(function (h, i) {
      var pr = project(h.lat, h.lng);
      var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pr.x.toFixed(1));
      c.setAttribute('cy', pr.y.toFixed(1));
      c.setAttribute('r', 1.9);
      c.setAttribute('class', 'host-pin');
      c.setAttribute('data-idx', i);
      pinsLayer.appendChild(c);
      h.el = c;
      h.name = hostName(i);
      h.groupBuy = groupBuyFor(i);
      h.approvalMode = approvalModeFor(i); // 'open' | 'approval' | 'question'
      if (h.approvalMode === 'question') h.joinQuestion = joinQuestionFor(i);
      // Note: the 150 background dots are NOT hoverable — only the prominent
      // pins (default partners, or the closest 9 after a search) respond to hover.
    });

    // ─── Hover tooltip: shared by prominent map pins and the host-card list ───
    var hoverLayer = document.getElementById('hoverPinLayer');
    var tooltipEl = document.getElementById('hostTooltip');
    var mapStageEl = document.querySelector('.hero-map-card .map-stage');
    var svgEl = document.getElementById('sgMapSvg');

    // Cross-references so hovering a pin highlights its list card and vice versa
    var hostCardMap = new Map();
    var pinElMap = new Map();
    var currentHighlightedCard = null;
    var currentHighlightedPin = null;

    function highlightCard(h) {
      clearCardHighlight();
      var card = hostCardMap.get(h);
      if (card) { card.classList.add('host-card-highlight'); currentHighlightedCard = card; }
    }
    function clearCardHighlight() {
      if (currentHighlightedCard) { currentHighlightedCard.classList.remove('host-card-highlight'); currentHighlightedCard = null; }
    }
    function highlightPin(h) {
      clearPinHighlight();
      var pinEls = pinElMap.get(h);
      if (pinEls) {
        pinEls.inner.classList.add('pin-active');
        currentHighlightedPin = pinEls.inner;
        // Defer the reorder so it doesn't run mid-dispatch of the mouseenter
        // event that triggered it — reordering a node while it's mid-event
        // confuses the browser's hover tracking and can leave hover "stuck".
        setTimeout(function () {
          if (pinEls.outer.parentNode) pinEls.outer.parentNode.appendChild(pinEls.outer);
        }, 0);
      }
    }
    function clearPinHighlight() {
      if (currentHighlightedPin) { currentHighlightedPin.classList.remove('pin-active'); currentHighlightedPin = null; }
    }

    var tooltipHideTimer = null;
    function cancelHideTooltip() { clearTimeout(tooltipHideTimer); }
    function scheduleHideTooltip() {
      clearTimeout(tooltipHideTimer);
      tooltipHideTimer = setTimeout(hideHostTooltip, 120);
    }
    tooltipEl.addEventListener('mouseenter', cancelHideTooltip);
    tooltipEl.addEventListener('mouseleave', scheduleHideTooltip);

    function tooltipJoinLabel(h) {
      if (isHostPending(h)) return 'Pending approval';
      return h.approvalMode === 'open' ? 'Join' : 'Request to Join';
    }

    function showHostTooltip(h) {
      cancelHideTooltip();
      highlightCard(h);
      highlightPin(h);
      var svgRect = svgEl.getBoundingClientRect();
      var stageRect = mapStageEl.getBoundingClientRect();
      var scaleX = svgRect.width / currentViewBox.w;
      var scaleY = svgRect.height / currentViewBox.h;
      var pr = project(h.lat, h.lng);
      var pinTopY = pr.y - 43.7 * pinScaleFactor(); // svg-unit y of the pin's visual top
      var px = (svgRect.left - stageRect.left) + (pr.x - currentViewBox.x) * scaleX;
      var py = (svgRect.top - stageRect.top) + (pinTopY - currentViewBox.y) * scaleY - 10;

      var pending = isHostPending(h);
      tooltipEl.innerHTML =
        '<div class="tt-avatar">' + h.groupBuy.emoji + '</div>' +
        '<div class="tt-info">' +
          '<div class="tt-name">' + h.groupBuy.name + '</div>' +
          '<div class="tt-host">Hosted by ' + h.name + '</div>' +
        '</div>' +
        '<button type="button" class="tt-join' + (pending ? ' is-pending' : '') + '"' + (pending ? ' disabled' : '') + '>' + tooltipJoinLabel(h) + '</button>';
      tooltipEl.style.left = px + 'px';
      tooltipEl.style.top = py + 'px';
      tooltipEl.classList.add('show');
      var ttJoinBtn = tooltipEl.querySelector('.tt-join');
      if (ttJoinBtn && !pending) ttJoinBtn.addEventListener('click', function () { joinHost(h); });
    }

    function ringOnly(h) {
      // Force-close any pin tooltip immediately — a card hover never shows
      // the tooltip itself, so there's no reason to wait on its hide delay.
      hideHostTooltip();
      highlightPin(h);
      highlightCard(h);
    }
    function clearRingOnly() {
      clearPinHighlight();
      clearCardHighlight();
    }

    function hideHostTooltip() {
      clearTimeout(tooltipHideTimer);
      tooltipEl.classList.remove('show');
      clearCardHighlight();
      clearPinHighlight();
    }

    // Draws the prominent teardrop pins for the given hosts, hides the plain
    // dot underneath each one, and wires hover so ONLY these pins respond.
    // Mobile has no hover, so pins get a tap-twice affordance: first tap
    // highlights + shows the tooltip, a second tap on the same pin follows
    // the Join link. Tapping elsewhere resets it.
    var activeTapHost = null;
    function handlePinTap(h, evt) {
      if (activeTapHost === h) {
        joinHost(h);
        return;
      }
      if (evt && evt.preventDefault) evt.preventDefault();
      activeTapHost = h;
      showHostTooltip(h);
    }
    document.addEventListener('click', function (e) {
      if (!svgEl.contains(e.target) && !tooltipEl.contains(e.target)) {
        activeTapHost = null;
        hideHostTooltip();
      }
    });

    function renderProminentPins(list) {
      hosts.forEach(function (h) { h.el.style.opacity = ''; });
      nearPinsLayer.innerHTML = '';
      pinElMap.clear();
      list.forEach(function (h) {
        h.el.style.opacity = '0';
        var pr = project(h.lat, h.lng);
        var pinEls = createPinEl(pr.x, pr.y, h.groupBuy.emoji);
        nearPinsLayer.appendChild(pinEls.outer);
        pinEls.outer.style.cursor = 'pointer';
        pinEls.outer.addEventListener('mouseenter', function () { showHostTooltip(h); });
        pinEls.outer.addEventListener('mouseleave', scheduleHideTooltip);
        pinEls.outer.addEventListener('click', function (e) { handlePinTap(h, e); });
        requestAnimationFrame(function () { pinEls.inner.classList.add('show'); });
        pinElMap.set(h, pinEls);
      });
    }

    // Populate the datalist for autocomplete
    var datalist = document.getElementById('sgAreas');
    Object.keys(AREAS).forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      datalist.appendChild(opt);
    });

    var input = document.getElementById('hostSearch');

    var hostListWrap = document.getElementById('hostListWrap');
    var hostList = document.getElementById('hostList');
    var hostListTitle = document.getElementById('hostListTitle');

    function buildCard(h, subtitle, idx) {
      var card = document.createElement('div');
      card.className = 'host-card';
      var pending = isHostPending(h);
      var label = pending ? 'Pending approval' : (h.approvalMode === 'open' ? 'Join' : 'Request to Join');
      card.innerHTML =
        '<div class="host-card-avatar">' + h.groupBuy.emoji + '</div>' +
        '<div class="host-card-info">' +
          '<div class="host-card-name">' + h.groupBuy.name + '</div>' +
          '<div class="host-card-dist">' + subtitle + '</div>' +
        '</div>' +
        '<button type="button" class="host-card-join' + (pending ? ' is-pending' : '') + '"' + (pending ? ' disabled' : '') + '>' + label + '</button>';
      card.addEventListener('mouseenter', function () { ringOnly(h); });
      card.addEventListener('mouseleave', clearRingOnly);
      var cardJoinBtn = card.querySelector('.host-card-join');
      cardJoinBtn.__host = h; // so refreshAllJoinButtons() can find its host after the fact
      if (cardJoinBtn && !pending) cardJoinBtn.addEventListener('click', function (e) { e.stopPropagation(); joinHost(h); });
      hostList.appendChild(card);
      hostCardMap.set(h, card);
      setTimeout(function () { card.classList.add('show'); }, idx * 40);
    }

    // Idle state: the default 9 partner pins still show on the map, but
    // the card list stays hidden until the person actually searches.
    function showDefaultPartners() {
      hostList.innerHTML = '';
      hostCardMap.clear();
      hostListTitle.textContent = 'Our partner group buys';
      var defaultPartners = hosts.slice(0, 9);
      defaultPartners.forEach(function (h, idx) {
        buildCard(h, 'Hosted by ' + h.name, idx);
      });
      hostListWrap.classList.add('show');
      renderProminentPins(defaultPartners);
    }

    function clearHighlights() {
      hideHostTooltip();
      searchLayer.innerHTML = '';
      showDefaultPartners();
      animateViewBox(fullViewBox, 450);
    }

    function showNearest(pos, label) {
      hideHostTooltip();
      searchLayer.innerHTML = '';

      var withDist = hosts.map(function (h) {
        return { h: h, d: haversineKm(pos[0], pos[1], h.lat, h.lng) };
      }).sort(function (a, b) { return a.d - b.d; });

      var nearest10 = withDist.slice(0, 9).map(function (item) { return item.h; });
      var distByHost = withDist.slice(0, 9);
      renderProminentPins(nearest10);

      hostList.innerHTML = '';
      hostCardMap.clear();
      hostListTitle.textContent = 'Closest hosts near you';
      distByHost.forEach(function (item, idx) {
        buildCard(item.h, 'Hosted by ' + item.h.name + ' · ' + item.d.toFixed(1) + ' km', idx);
      });
      hostListWrap.classList.add('show');

      // Searched location (used for zoom framing only — no marker drawn,
      // since geocoding an area/postal sector is only approximate)
      var pr = project(pos[0], pos[1]);

      var nearestKm = distByHost[0].d.toFixed(1);

      // Zoom the map into the searched area + its closest 9 hosts
      var zoomPoints = nearest10.map(function (h) { return project(h.lat, h.lng); });
      zoomPoints.push(pr);
      animateViewBox(zoomToPoints(zoomPoints, W * 0.58), 500);
    }

    input.addEventListener('input', function () {
      var raw = input.value.trim();
      var key = raw.toLowerCase();
      var digitsOnly = raw.replace(/\D/g, '');

      if (digitsOnly.length >= 2 && digitsOnly === raw) {
        // Looks like a postal code (or the start of one) — use its 2-digit sector
        var sector = digitsOnly.slice(0, 2);
        var pos = sectorToLatLng(sector);
        if (pos) {
          showNearest(pos, 'postal sector ' + sector);
          return;
        }
        clearHighlights();
        return;
      }

      if (AREAS[key]) {
        var label = key.replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        showNearest(AREAS[key], label);
      } else {
        clearHighlights();
      }
    });

    showDefaultPartners();
  })();
</script>

</script>
