<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>co·bee — Settings</title>
<style>
/* co·bee group settings — tab bar + white section cards, single light theme to match the app.
   Teal #009A97 primary, warm greys, amber marks unsaved changes. */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunk:#F4F6F8; --fg:#1A1A18; --muted:#888780; --line:#E0DFD8; --line-soft:#F0F0EE;
  --teal:#009A97; --teal-dark:#007A77; --teal-soft:#E0F5F5; --teal-line:#80CCCB;
  --amber:#E8971A; --amber-soft:#FEF2DC; --purple:#7B2D8B; --red:#E24B4A; --red-soft:#FCEBEB;
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;margin:0}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.tabs-wrap{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tabs-inner{max-width:1100px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:14px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--teal)}
.tab[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal);font-weight:600}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px;background:var(--surface);width:220px;max-width:100%}
.search input{border:none;outline:none;font-size:13px;flex:1;min-width:0;background:transparent;color:var(--fg)}
@media (max-width:640px){.search{width:100%;margin-bottom:8px}}

.page{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:grid;gap:20px}
.page.with-preview{grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:960px){.page.with-preview{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.intro{display:flex;gap:12px;align-items:flex-start;background:var(--teal-soft);border:1px solid var(--teal-line);border-radius:10px;padding:12px 14px;font-size:12.5px}
.intro .lk{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--teal)}
.intro p{margin:0}

.section{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{padding:12px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sec-h span{font-size:11px;color:var(--muted)}
.rows{display:flex;flex-direction:column}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;padding:13px 18px;border-top:1px solid var(--line-soft);position:relative;align-items:center}
.row:first-child{border-top:none}
.row.changed::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.row.sub{background:#FAFBFB;padding-left:34px}
.row .tt{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .ds{font-size:11.5px;color:var(--muted);margin-top:2px;max-width:62ch}
.row .note{grid-column:1 / -1;font-size:11.5px;color:var(--purple);background:#F3E9FA;border-radius:6px;padding:6px 10px;display:flex;gap:6px;align-items:flex-start}
.ctl{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.ctl{justify-content:flex-start}}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
.chip.lock{background:var(--teal-soft);color:var(--teal)}
.chip.pro{background:#F3E9FA;color:var(--purple)}
.chip.def{background:var(--sunk);color:var(--muted);font-weight:600}

.sw{width:38px;height:22px;border-radius:99px;background:#D3D1C7;border:none;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{left:18px}
.sw:disabled{opacity:.5;cursor:not-allowed}

.seg{display:inline-flex;border:1px solid #D3D1C7;border-radius:8px;overflow:hidden;background:var(--surface);max-width:100%;flex-wrap:wrap}
.seg button{border:none;background:none;padding:0 12px;height:32px;font-size:12px;color:var(--fg);cursor:pointer;border-left:1px solid #D3D1C7;white-space:nowrap}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;font-weight:600}
.seg button:disabled{cursor:not-allowed;opacity:.55}

.num{display:inline-flex;align-items:center;border:1px solid #D3D1C7;border-radius:8px;overflow:hidden;height:32px;background:var(--surface)}
.num span{padding:0 9px;font-size:12px;color:var(--muted);background:var(--sunk);height:100%;display:flex;align-items:center}
.num input{width:64px;border:none;outline:none;padding:0 8px;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.txt{height:32px;border:1px solid #D3D1C7;border-radius:8px;padding:0 10px;font-size:13px;width:240px;max-width:100%;color:var(--fg)}
textarea.txt{height:60px;padding:8px 10px;width:100%;resize:vertical;font-family:inherit}
.row.wide .ctl{grid-column:1 / -1;justify-content:stretch}
select.txt{width:auto}

.lockbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:#B4B2A9;flex-shrink:0}
.lockbtn:hover{color:var(--teal);border-color:var(--teal-line)}
.lockbtn[aria-pressed="true"]{color:var(--teal);background:var(--teal-soft);border-color:var(--teal-line)}

.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:flex;align-items:center;gap:7px;border:1px solid #D3D1C7;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;background:var(--surface)}
.ck input{accent-color:var(--teal)}
.ck.on{border-color:var(--teal);background:var(--teal-soft)}

.sb{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sb-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sb-msg{flex:1;min-width:200px;font-size:12.5px}
.sb-msg b{color:var(--amber)}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid #D3D1C7;background:var(--surface);font-size:13px;cursor:pointer;color:var(--fg)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--teal-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.apply{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;width:100%;padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--fg);color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.where{font-size:10.5px;font-weight:600;color:var(--teal);letter-spacing:.04em;text-transform:uppercase}

/* member preview */
.pv{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:8px}
.pv-lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.phone{border:8px solid #2a2a28;border-radius:26px;overflow:hidden;background:var(--pbg,#F4F6F8);height:520px;display:flex;flex-direction:column}
.ph-top{background:var(--ptop,#7B2D8B);color:var(--ptxt,#fff);text-align:center;padding:10px 8px 8px;font-weight:700;font-size:13px}
.ph-tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);font-size:10.5px}
.ph-tabs span{flex:1;text-align:center;padding:7px 0;color:var(--muted)}
.ph-tabs span.on{color:var(--pprim,#7B2D8B);border-bottom:2px solid var(--pprim,#7B2D8B);font-weight:700}
.ph-body{flex:1;overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:6px}
.ph-feed{display:grid;gap:6px}
.ph-feed.tile{grid-template-columns:1fr 1fr}
.ev{background:#fff;border-radius:8px;border:1px solid var(--line);overflow:hidden;font-size:10.5px}
.ev .img{background:linear-gradient(135deg,#E0F5F5,#FEF2DC)}
.ph-feed.list .ev{display:flex;gap:6px;padding:5px}
.ph-feed.list .ev .img{width:38px;height:38px;border-radius:6px;flex-shrink:0}
.ph-feed.tile .ev .img{height:56px}
.ph-feed.tile .ev .bd{padding:5px}
.ev b{display:block;font-size:10.5px;color:var(--pitem,#1A1A18)}
.ev .pr{color:var(--pprice,#7B2D8B);font-weight:700}
.hexsw{width:36px;height:32px;border:1px solid #D3D1C7;border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.txt.hex{width:92px;font-family:var(--mono);font-size:12px;text-transform:uppercase}
.thumb{width:64px;height:40px;border-radius:8px;border:1.5px dashed var(--teal-line);background:var(--teal-soft);display:grid;place-items:center;color:var(--teal-line)}
.thumb.round{width:44px;height:44px;border-radius:50%}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.slug{display:flex;align-items:center;border:1px solid #D3D1C7;border-radius:8px;overflow:hidden;height:32px;max-width:100%;background:var(--surface)}
.slug > span:first-child{padding:0 8px;background:var(--sunk);height:100%;display:flex;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.slug input{border:none;outline:none;padding:0 8px;font-family:var(--mono);font-size:12.5px;width:120px;min-width:0;color:var(--fg)}
.slug-st{padding:0 9px;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;border-left:1px solid #D3D1C7;background:var(--sunk)}
.slug-st.ok{color:#27AE60}.slug-st.bad{color:var(--red)}
.tt .req{font-size:10px;font-weight:600;color:var(--red)}
.links{display:flex;flex-direction:column;gap:8px;width:100%}
.link-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px}
.link-row .txt{width:100%}
@media (max-width:560px){.link-row{grid-template-columns:minmax(0,1fr) auto}.link-row .txt:nth-child(2){grid-column:1}}
.btn.danger{color:var(--red);border-color:#F09595}
.btn.addlink{align-self:flex-start;color:var(--teal);border-style:dashed}
/* Profile tab — same classes and look as today's settings.html */
.legacy .section-header{padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.legacy .section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.legacy .section-body{padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.legacy .profile-photo-wrap{display:flex;align-items:flex-start;gap:16px}
.legacy .photo-circle{width:80px;height:80px;border-radius:50%;background:var(--teal-soft);border:2px dashed var(--teal-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0}
.legacy .photo-circle span{font-size:9px;color:var(--muted)}
.legacy .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
@media (max-width:640px){.legacy .two-col{grid-template-columns:minmax(0,1fr)}}
.legacy .field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.legacy .field label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.legacy .field label .req{color:var(--red);margin-left:2px}
.legacy .input,.legacy .select{height:38px;border:1px solid #D3D1C7;border-radius:8px;padding:0 12px;font-size:13px;font-family:inherit;color:var(--fg);background:var(--surface);width:100%;outline:none}
.legacy .input:focus,.legacy .select:focus,.legacy .textarea:focus{border-color:var(--teal)}
.legacy .textarea{border:1px solid #D3D1C7;border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--fg);width:100%;resize:vertical;min-height:80px;outline:none}
.legacy .helper{font-size:11px;color:var(--muted);line-height:1.5}
.legacy .divider{height:1px;background:var(--line-soft)}
.legacy .sub-lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.legacy .url-lbl{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.05em}
.legacy .prem{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:#8E44AD;background:#F3E9FA;border:1px solid #D9BEEA;border-radius:99px;padding:2px 8px;letter-spacing:.03em}
.legacy .slug{height:38px}
.legacy .slug input{flex:1}
.legacy .url-prev{font-family:var(--mono);font-size:11px;color:var(--teal);word-break:break-all}
.legacy .contact-row{display:flex;align-items:center;gap:10px;position:relative}
.legacy .contact-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.legacy .input-prefix{display:flex;align-items:center;border:1px solid #D3D1C7;border-radius:8px;overflow:hidden;flex:1;min-width:0}
.legacy .input-prefix .prefix{padding:0 10px;background:var(--sunk);border-right:1px solid #D3D1C7;height:38px;display:flex;align-items:center;font-size:12px;color:var(--muted);flex-shrink:0;width:86px}
.legacy .input-prefix .input{border:none;border-radius:0}
.legacy .field.changed::before,.legacy .contact-row.changed::before{content:"";position:absolute;left:-10px;top:0;bottom:0;width:3px;border-radius:3px;background:var(--amber)}
.legacy .slug.changed{border-color:var(--amber)}
.ev .badge{display:inline-block;font-size:8.5px;font-weight:700;color:#fff;background:var(--pacc,#E8971A);border-radius:4px;padding:1px 4px;margin-top:2px}
.ev .cnt{color:var(--muted);font-size:9.5px}
.ph-foot{text-align:center;font-size:9px;color:var(--muted);padding:6px}
.ph-body{overflow-y:auto}
.ph-feed.tile.c3{grid-template-columns:1fr 1fr 1fr}
.ph-feed.tile.c3 .ev .img{height:40px}
.ph-feed.tile.land .ev .img{height:40px}
.ph-feed.prod.tile:not(.land):not(.c3) .ev .img{height:auto;aspect-ratio:1}
.ph-grp{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.ph-filters{display:flex;gap:4px;flex-wrap:wrap}
.ph-filters span{font-size:9px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 7px;color:var(--fg)}
.ph-filters.pills span.on{background:var(--pprim,#7B2D8B);border-color:var(--pprim,#7B2D8B);color:#fff}
.qadd{display:inline-block;margin-top:3px;font-size:9px;font-weight:700;color:var(--pprim,#7B2D8B);border:1px solid var(--pprim,#7B2D8B);border-radius:5px;padding:1px 5px}
.pin{font-size:8.5px;font-weight:700;color:var(--pprim,#7B2D8B);text-transform:uppercase}
.ev.closed{opacity:.55}.ev.closed .bd,.ev.order .bd{padding:6px}
.stt{font-size:8.5px;font-weight:700;border-radius:4px;padding:1px 4px}
.stt.un{background:var(--red-soft);color:var(--red)}.stt.pd{background:var(--teal-soft);color:var(--teal)}.stt.dn{background:var(--sunk);color:var(--muted)}
.paybar{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:10px}
.pbb{background:var(--pprim,#7B2D8B);color:#fff;font-weight:700;border-radius:5px;padding:3px 7px}
.pageseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.pageseg button{flex:1;min-width:110px;border:none;background:none;border-radius:7px;padding:9px 10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pageseg button[aria-selected="true"]{background:var(--teal);color:#fff;font-weight:600}
.pageseg .ps-h{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--amber-soft);color:var(--amber)}
.pageseg button[aria-selected="true"] .ps-h{background:rgba(255,255,255,.25);color:#fff}
.pageseg .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.ph-wa{background:#25D366;color:#fff;border-radius:6px;text-align:center;font-size:10px;font-weight:700;padding:5px}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.warn{color:var(--red);font-size:11.5px;display:flex;gap:4px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="tabs-wrap">
  <div class="tabs-inner">
    <div class="tabs" role="tablist" id="tabs"></div>
    <label class="search" for="q"><span aria-hidden="true" style="color:var(--muted)">&#9906;</span><input id="q" type="search" placeholder="Search settings" autocomplete="off"></label>
  </div>
</div>

<div class="page" id="page"></div>

<div class="sb" id="sb" hidden>
  <div class="sb-in">
    <div class="sb-msg" id="sb-msg"></div>
    <button class="btn" id="discard" type="button">Discard</button>
    <button class="btn primary" id="save" type="button">Save changes</button>
    <div class="apply" id="apply" hidden>
      <span>Apply event defaults to:</span>
      <div class="seg" role="group" aria-label="Apply to">
        <button type="button" data-apply="new" aria-pressed="true">New events only</button>
        <button type="button" data-apply="open" aria-pressed="false">New + 3 open events</button>
      </div>
      <button class="btn primary" id="confirm" type="button">Confirm save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var LOCK_SVG='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

// lockable: per-event option the owner can lock for co-hosts
// parent: shown only when the parent toggle is on
var TABS=[
 {id:'profile',label:'Profile',intro:'Who your group is. This appears on event cards, your group page and emails.',sections:[

   {k:'slug',t:'Group URL',d:'Your own branded page. Members go straight to your group\'s events.',type:'slug',v:'m6group',pro:true},
   {k:'headline',t:'Headline / description',d:'',type:'area',v:'Good things must share! Join M6 Group for the best group buys in Singapore.'},
   {k:'address',t:'Address',d:'Also used as the default pick-up location for new events.',type:'text',v:'Simei Street 1, Singapore 529948',req:true}
  ]},
  {title:'Region',rows:[
   {k:'tz',t:'Time zone',d:'Closing and collection times use this.',type:'select',opts:[['sg','Asia / Singapore'],['kl','Asia / Kuala Lumpur'],['utc','UTC']],v:'sg'},
   {k:'currency',t:'Currency',d:'',type:'select',opts:[['SGD','SGD — Singapore Dollar'],['MYR','MYR — Malaysian Ringgit'],['USD','USD — US Dollar']],v:'SGD'}
  ]},
  {title:'Contact & social',hint:'Shown in the group page header',rows:[

// ── State ─────────────────────────────────────────────────────────────
var state={},initial={},locks={},initLocks={},rowTab={};
TABS.forEach(function(tab){tab.sections.forEach(function(s){s.rows.forEach(function(r){
  if(s.seg)r._seg=s.seg;
  state[r.k]=Array.isArray(r.v)?r.v.slice():r.v; initial[r.k]=JSON.stringify(r.v); rowTab[r.k]=tab;
  if(r.lockable){locks[r.k]=(r.k==='payTogether'||r.k==='timing');initLocks[r.k]=locks[r.k];}
});});});
var current='profile', query='', applyMode='new';

// ── Persistence (mock-up: browser localStorage) ───────────────────────
// Saved under the same key and with the same top-level fields that
// group-portal.html already reads (groupName, title, primary, accent, bg,
// topbar), so the branded portal keeps working unchanged. Every other
// setting is stored alongside in `settings` / `locks`.
var STORE_PREFIX='cobee_group_';
function storeKey(slug){return STORE_PREFIX+(slug||'m6group');}
function loadSaved(){
  var raw=null; try{raw=localStorage.getItem(storeKey(state.slug));}catch(e){}
  if(!raw) return;
  var cfg=null; try{cfg=JSON.parse(raw);}catch(e){return;}
  if(!cfg) return;
  if(cfg.settings){
    Object.keys(cfg.settings).forEach(function(k){if(k in state)state[k]=cfg.settings[k];});
    if(cfg.locks)Object.keys(cfg.locks).forEach(function(k){if(k in locks)locks[k]=!!cfg.locks[k];});
  } else {
    // Older save from the previous settings page: only branding was stored.
    if(cfg.groupName)state.groupName=cfg.groupName;
    if(cfg.title)state.siteTitle=cfg.title;
    if(cfg.primary){state.cPrimary=cfg.primary;state.colors=cfg.primary;state.cPrice=cfg.primary;}
    if(cfg.accent)state.cAccent=cfg.accent;
    if(cfg.bg)state.cBg=cfg.bg;
    if(cfg.topbar)state.cTop=cfg.topbar;
  }
  Object.keys(state).forEach(function(k){initial[k]=JSON.stringify(state[k]);});
  Object.keys(locks).forEach(function(k){initLocks[k]=locks[k];});
}
function persist(){
  var cfg={
    slug:state.slug, groupName:state.groupName, title:state.siteTitle||state.groupName,
    primary:state.cPrimary, accent:state.cAccent, bg:state.cBg, topbar:state.cTop,
    settings:state, locks:locks, applyTo:applyMode, savedAt:new Date().toISOString()
  };
  try{localStorage.setItem(storeKey(state.slug),JSON.stringify(cfg));return true;}catch(e){return false;}
}
loadSaved();

// Dependency rules — the one place cross-option logic lives
function forced(k){
  if(k==='keywords' && state.approval==='auto') return {v:false,why:'Not needed when members join instantly.'};
  return null;
}
function visible(r){
  if(!r.parent) return true;
  if(r.parent==='pViewTile') return state.pView==='tile';
  if(r.parent==='approvalQ') return state.approval==='question';
  if(r.parent.indexOf('m:')===0) return state.methods.indexOf(r.parent.slice(2))>=0;
  if(r.parent==='keywords') return state.approval==='question'&&!!state.keywords;
  return !!state[r.parent];
}
var RESERVED=['admin','api','app','www','shop','group','store','signin','signup','member','members','hosting','settings','profile','dashboard','functions','join','uploads','index'];
var layoutSeg='events';
function segLabel(id){var s=TABS.filter(function(t){return t.id==='layout';})[0].segments.filter(function(x){return x[0]===id;})[0];return s?s[1]:'';}
function changedKeys(){var out=[];Object.keys(state).forEach(function(k){if(JSON.stringify(state[k])!==initial[k])out.push(k);});Object.keys(locks).forEach(function(k){if(locks[k]!==initLocks[k]&&out.indexOf(k)<0)out.push(k);});return out;}
function lum(hex){var h=(hex||'#000000').replace('#','');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return (0.299*r+0.587*g+0.114*b)/255;}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
